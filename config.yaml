experiment:
  datasets:
    - "FD001"
    - "FD002"
    - "FD003"
    - "FD004"
  raw_data_dir: "data/raw"
  save_dir: "models/saved"

preprocessing:
  max_rul: 125

features:
  window_size: 30

models:
  random_forest:
    n_estimators: 200
    max_depth: 15
    random_state: 42
    n_jobs: -1
  
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    lr: 0.001
    epochs: 20
    batch_size: 512

  tcn:
    num_channels: [32, 64, 128]
    kernel_size: 3
    epochs: 20
    batch_size: 512
    lr: 0.001

  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dropout: 0.2
    epochs: 10
    batch_size: 512
    lr: 0.001
    warmup_ratio: 0.1